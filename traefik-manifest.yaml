        rate-limiting:
          rateLimit:
            average: 10
            period: 1s
            burst: 50
        # Retry 4 times with exponential backoff
        retries:
          retry:
            attempts: 2
            initialInterval: 100ms
        circuit-breaker:
          circuitBreaker:
            expression: LatencyAtQuantileMS(50.0) > 1000 || ResponseCodeRatio(400, 600, 0, 600) > 0.5 || NetworkErrorRatio() > 0.50
            checkPeriod: 10s
            fallbackDuration: 30s
            recoveryDuration: 1m
        compression:
          compress:
            minResponseBodyBytes: 1200
        buffer:
          buffering:
            maxRequestBodyBytes: 2000000  
            maxResponseBodyBytes: 2000000   # to be measured
