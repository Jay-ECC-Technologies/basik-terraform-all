    http:
      middlewares:         
        corsHeader:
          headers:
            accessControlAllowCredentials: true
            accessControlAllowHeaders: 
            - Accept
            - Access-Control-Request-Headers 
            - Access-Control-Request-Method 
            - Authorization 
            - Content-Type 
            - Last-Modified 
            - Origin 
            - X-Requested-With
            - X-Private-Ticket-Token
            - x-openreplay-sessiontoken
            - x-meilisearch-client
            - x-request-origin
            - X-Sitemap-Token         # MFE Sitemap 
            - novu-api-version         
            accessControlExposeHeaders:
            - X-Total-Count
            - X-Total-Pages
            - X-Current-Page
            - X-Per-Page
            accessControlAllowMethods: "*"
            accessControlAllowOriginList: 
            - https://beta.theesports.club
            - https://admin.theesports.club
            - https://admin.alpha.theesports.club
            - https://tournaments.theesports.club
            - https://cms.theesports.club
            - https://theesports.club
            - https://basikmarketing.in
            - https://api.theesports.club
            - https://gossip.gg
            - http://localhost:3000
            - http://localhost:8000
            - https://tec-novu.theesports.club
            - https://novu.theesports.club
            - https://gateway.alpha.theesports.club          
            - https://spartans.alpha.theesports.club
            - https://gateway.spartans.theesports.club          
            - https://admin.spartans.theesports.club
            - https://leads.theesports.club 
            - https://url.theesports.club
            - https://payouts.theesports.club
            - https://strikeworldiitb.com  
            - https://admin.strikeworldiitb.com 
            - https://backstage.theesports.club
            - https://360.basikmarketing.in              
            accessControlMaxAge: 600
            addVaryHeader: true
        fusionauthHeaders:
          headers:
            customRequestHeaders:
              Authorization: uES98ju3UYPdem8gThus7fPeo2snCaeR5JhVnpB835LKPle5pw0VxIbb
        basic-admin-auth:
          basicAuth:
            users:
              # password - tecadminpassword - hashed with bcrypt
              - "tec-admin:$2a$12$Tym1UNoJ2xPeULdexzhV1uFXoUHpBv8WnRjz2L01AtzCZQEq9gvEe"
        strip-service-prefix:
          # Modifies "/team/hello" to "/hello"
          replacePathRegex:
            regex: '^/$1/$1/(.*)'
            #regex: '^/.*?/(.*)'
            replacement: '/$1'
        redirect-to-360:
          redirectRegex:
            regex: "^https?://payouts\\.theesports\\.club/(.*)"
            replacement: "https://360.basikmarketing.in/$1"
            permanent: false
        socketHeaders:
          headers:
            customRequestHeaders:
              Connection: "keep-alive, Upgrade"
              # Connection: "Upgrade"
              X-Forwarded-Proto: "https"
              Upgrade: "WebSocket"
        socket-prefix-rewrite:          
          replacePathRegex:
            regex: '^/notifications/'
            replacement: '/'
        fusionauth-prefix:
          # Modifies "/team/hello" to "/hello"
          replacePathRegex:
            regex: '^/auth/(.*)'
            replacement: '/api/$1'
        security-headers:
          headers:
            frameDeny: true
            browserXssFilter: true
            contentTypeNosniff: true
            stsIncludeSubdomains: true
            stsPreload: true
            sslRedirect: true            
        # cloudflare-ipwhitelist:
        #   ipWhiteList:
        #     sourceRange:
        #       - 173.245.48.0/20
        #       - 103.21.244.0/22
        #       - 103.22.200.0/22
        #       - 103.31.4.0/22
        #       - 141.101.64.0/18
        #       - 108.162.192.0/18
