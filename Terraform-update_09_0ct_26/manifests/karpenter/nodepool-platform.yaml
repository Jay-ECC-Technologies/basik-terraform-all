apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: platform
spec:
  disruption:
    budgets:
    - nodes: 10%
    consolidateAfter: 60s
    consolidationPolicy: WhenEmpty
  limits:
    cpu: '64'
    nodes: 20
  template:
    metadata:
      labels:
        role: platform
    spec:
      expireAfter: 72h
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
      - key: kubernetes.io/arch
        operator: In
        values:
        - amd64
      - key: kubernetes.io/os
        operator: In
        values:
        - linux
      - key: karpenter.sh/capacity-type
        operator: In
        values:
        - on-demand
      - key: topology.kubernetes.io/zone
        operator: In
        values:
        - ap-south-1a
        - ap-south-1b
      - key: node.kubernetes.io/instance-type
        operator: In
        values:
        - t3a.medium
        - t3a.large
        - t3a.xlarge
  weight: 10
