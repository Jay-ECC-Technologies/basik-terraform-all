replicaCount: 2

region: ap-south-1

enableShield: true

enableWafv2: false

enableWaf: false

enableServiceMutatorWebhook: true

podDisruptionBudget:
  maxUnavailable: 1

resources:

  requests:
    cpu: 300m
    memory: 500Mi

  limits:
    cpu: 600m
    memory: 1024Mi