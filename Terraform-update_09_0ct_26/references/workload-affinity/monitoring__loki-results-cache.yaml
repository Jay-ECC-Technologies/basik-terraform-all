namespace: monitoring
workload: loki-results-cache
kind: StatefulSet
replicas: 1
nodeSelector: null
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: role
          operator: In
          values:
          - platform
        - key: topology.kubernetes.io/zone
          operator: In
          values:
          - ap-south-1b
topologySpreadConstraints: null
tolerations: null
