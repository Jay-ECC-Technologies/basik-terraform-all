namespace: mongodb
workload: masterdb
kind: StatefulSet
replicas: 3
nodeSelector: null
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: role
          operator: In
          values:
          - platform
topologySpreadConstraints: null
tolerations: null
