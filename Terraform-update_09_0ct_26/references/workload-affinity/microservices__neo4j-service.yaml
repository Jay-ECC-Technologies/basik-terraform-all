namespace: microservices
workload: neo4j-service
kind: Deployment
replicas: 1
nodeSelector: null
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: role
          operator: In
          values:
          - tec
topologySpreadConstraints: null
tolerations: null
