namespace: kube-system
workload: snapshot-controller
kind: Deployment
replicas: 2
nodeSelector:
  kubernetes.io/os: linux
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - preference:
        matchExpressions:
        - key: eks.amazonaws.com/compute-type
          operator: NotIn
          values:
          - fargate
          - auto
          - hybrid
      weight: 1
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - snapshot-controller
        topologyKey: kubernetes.io/hostname
      weight: 100
topologySpreadConstraints: null
tolerations:
- key: CriticalAddonsOnly
  operator: Exists
- effect: NoExecute
  operator: Exists
  tolerationSeconds: 300
