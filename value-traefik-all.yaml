additionalArguments:
- --providers.file.filename=/config/config.yaml
- --serversTransport.insecureSkipVerify=true
additionalVolumeMounts: []
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: eks.amazonaws.com/nodegroup
          operator: In
          values:
          - private-nodes-eks-platform
autoscaling:
  enabled: true
  maxReplicas: 5
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 70
        type: Utilization
    type: Resource
  minReplicas: 3
certResolvers:
  leresolver:
    dnsChallenge:
      delayBeforeCheck: 30
      provider: cloudflare
      resolvers:
      - 1.1.1.1
      - 8.8.8.8
    email: naveen@basikmarketing.in
    storage: /data/acme.json
    tlsChallenge: false
commonLabels: {}

